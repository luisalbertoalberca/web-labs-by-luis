<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />

    <title>Proyecto 10 CSS</title>
</head>
<body>
    <div class="layout">

        <h1 class="layout__title">
            Busca tu hotel
        </h1>

        <form class="layout__search">
            <input type="search" class="search__input" placeholder="Busca tu hotel y lo encontraremos" />

            <button class="search__btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <main class="layout__results">
            <article class="results__result">
                <p class="result__subtitle">Nombre:</p>
                <h3 class="result__title">Hotel Luis</h3>
            </article>

            <article class="results__result">
                <p class="result__subtitle">Ubicacion:</p>
                <h3 class="result__title">Av. Diagonal, 1</h3>
            </article>

            <article class="results__result">
                <p class="result__subtitle">Fecha:</p>
                <h3 class="result__title">11/08/2026</h3>
            </article>
        </main>

        <section class="layout__map">
            <iframe class="map__frame"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3900.8590149664587!2d-77.0330764761031!3d-12.121797393299927!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c819aaa84439%3A0x52deb1f4f48d8bb2!2sParque%20Kennedy%2C%20Av%20Diagonal%2C%20Miraflores%2015074!5e0!3m2!1ses!2spe!4v1786479388148!5m2!1ses!2spe" 
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" 
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

    </div>
</body>
</html>
